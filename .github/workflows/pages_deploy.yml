name: 前端部署 (云书架)

# master 上 docs/ 前端文件变更时，同步到 gh-pages（不动任何站点数据）。
# 站点数据由 pages_crawler.yml 在爬取时装配，本工作流只管前端。

on:
  push:
    branches: [ master ]
    paths:
      - 'docs/**'
      - '!docs/comics/**'
      - '!docs/data/**'
  # 定时巡检：把已完成爬取但尚未装配的 data 分支增量装配到 gh-pages
  # （爬取与装配解耦：装配失败/卡住不影响爬取队列）
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      REASSEMBLE:
        description: '全量重装配 gh-pages（从所有 data 分支校准；修复装配失败/数据异常）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 同步前端到 gh-pages
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python usage/deploy_frontend.py

      - name: 巡检装配 gh-pages（增量：仅同步有变更的 data 分支）
        if: github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python usage/reassemble_pages.py

      # GITHUB_TOKEN 推送 gh-pages 不会自动触发 Pages 构建（GitHub 限制），需显式请求
      - name: 触发 Pages 部署
        run: |
          curl -sS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds || true
