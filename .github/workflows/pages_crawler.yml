name: 云端爬取 (云书架)

# 三种触发方式：
# 1. workflow_dispatch —— 网页通过 GitHub API 触发（需要 Token），也可在 Actions 页面手动运行
# 2. issues —— 网页引导用户创建标题为 `[jm] <目标>` 的 issue 触发（无需 Token）
#
# 爬取产物推送到该站孤立分支 data/<site>（单 commit force-push），
# 再装配进 gh-pages（单 commit force-push）由 Pages 托管，master 历史不再积累图片。

on:
  workflow_dispatch:
    inputs:
      TARGET:
        type: string
        description: '目标链接或ID（任意已支持站点；纯数字默认 JMComic 车号）。填 __cleanup__ 则执行保留清理'
        required: true

      SOURCE:
        description: '平台（auto = 按链接自动识别）'
        type: choice
        default: 'auto'
        options:
          - 'auto'
          - 'jmcomic'
          - 'mangadex'
          - 'nhentai'
          - 'manhuagui'
          - 'mkzhan'
          - 'telegraph'
          - 'wnacg'
          - 'ehentai'
          - 'bika'

      BATCH:
        type: number
        description: '批次号（多章节连载站点：20章/批，默认第 1 批；单章站点忽略）'
        default: 1

      MODE:
        description: '产物模式'
        type: choice
        default: '在线阅览 + 打包下载'
        options:
          - '在线阅览 + 打包下载'
          - '仅在线阅览'
          - '仅打包下载'

      KEEP_LATEST:
        type: number
        description: '该站书库最多保留几本（超出后书架提示「下载或清理」；宽限 +10 后硬删）'
        default: 30

      CLIENT_IMPL:
        type: string
        description: 'JMComic 客户端类型（client.impl），JM 下载失败时可尝试填入 api 或 html 重试'
        default: ''
        required: false

  issues:
    types: [ opened, reopened ]

permissions:
  contents: write # 推送 data/<site> 与 gh-pages 分支、Contents API 写状态文件
  issues: write   # 在 issue 下回复下载链接

concurrency:
  group: pages-crawler
  cancel-in-progress: false

jobs:
  build:
    # issue 触发时，仅处理标题以 [jm] 开头的 issue
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[jm]')
    runs-on: ubuntu-latest
    env:
      JM_PAGES_INPUT: ${{ github.event.inputs.TARGET || github.event.issue.title }}
      JM_PAGES_MODE_INPUT: ${{ github.event.inputs.MODE }}
      JM_PAGES_SOURCE: ${{ github.event.inputs.SOURCE || 'auto' }}
      JM_PAGES_BATCH: ${{ github.event.inputs.BATCH || 1 }}
      JM_PAGES_KEEP: ${{ github.event.inputs.KEEP_LATEST || 30 }}
      JM_PAGES_ISSUE_BODY: ${{ github.event.issue.body }}
      CLIENT_IMPL: ${{ github.event.inputs.CLIENT_IMPL }}
      JM_USERNAME: ${{ secrets.JM_USERNAME }}
      JM_PASSWORD: ${{ secrets.JM_PASSWORD }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependency
        run: |
          python -m pip install --upgrade pip
          pip install -e ./
          pip install psutil # usage_log 插件依赖

      - name: 解析产物模式
        run: |
          case "$JM_PAGES_MODE_INPUT" in
            *仅在线阅览*) mode=read ;;
            *仅打包下载*) mode=zip ;;
            *) mode=both ;;
          esac
          echo "JM_PAGES_MODE=$mode" >> $GITHUB_ENV
          echo "产物模式: $mode，平台: $JM_PAGES_SOURCE"

      - name: 爬取并发布站点数据（data 分支 + gh-pages 装配）
        id: build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python usage/workflow_pages_build.py

      # GITHUB_TOKEN 推送 gh-pages 不会自动触发 Pages 构建（GitHub 限制），需显式请求；
      # 失败时也要跑：last_run.json / wishlist.json 是 Contents API 直写 gh-pages 的，同样需要部署
      - name: 触发 Pages 部署
        if: always()
        run: |
          curl -sS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds || true

      - name: 回复 issue（提供访问链接）
        if: github.event_name == 'issues' && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PAGES_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          AID: ${{ steps.build.outputs.shelf_id }}
        run: |
          BODY=$(printf '✅ 爬取完成，站点部署约 1~2 分钟后生效：\n\n- 📚 书架：%s/\n- 📖 在线阅读：%s/reader.html?id=%s\n- 📦 打包下载：%s/comics/%s/\n\n（如 404 请稍等片刻并刷新）' "$PAGES_BASE" "$PAGES_BASE" "$AID" "$PAGES_BASE" "$AID")
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body "$BODY"
          gh issue close "$ISSUE_NUMBER" --repo "${{ github.repository }}" || true

      - name: 回复 issue（失败可见性）
        if: github.event_name == 'issues' && failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body '❌ 爬取失败：请查看本仓库 Actions 日志确认原因；若是未支持的站点，已自动加入设置页「愿望清单」。' || true
