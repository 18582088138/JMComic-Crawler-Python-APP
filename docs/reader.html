<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>阅读 - JMComic 云书架</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<script src="vendor/jszip.min.js"></script>
<style>
:root{
  --bar:rgba(14,16,23,.86); --line:rgba(255,255,255,.1);
  --txt:#eef1f8; --txt2:#9aa3b8; --txt3:#626c82;
  --ac1:#7c6cff; --ac2:#4dd0ff; --grad:linear-gradient(135deg,#7c6cff,#4dd0ff);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --barH:52px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:#000;color:var(--txt);overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
body.scroll-mode{overflow:auto}
button{font-family:inherit}

/* ---------- 顶栏 / 底栏 ---------- */
.bar{
  position:fixed;left:0;right:0;z-index:50;display:flex;align-items:center;gap:6px;
  background:var(--bar);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);transition:transform .28s ease;
  padding:0 8px;height:calc(var(--barH) + var(--sat));padding-top:var(--sat);
}
#topbar{top:0}
#bottombar{bottom:0;border-bottom:none;border-top:1px solid var(--line);
  height:calc(64px + var(--sab));padding-bottom:var(--sab);flex-wrap:wrap;align-content:center}
body.ui-hidden #topbar{transform:translateY(-110%)}
body.ui-hidden #bottombar{transform:translateY(110%)}
.tbtn{
  min-width:40px;height:40px;border:none;background:transparent;color:var(--txt);
  border-radius:12px;display:grid;place-items:center;cursor:pointer;flex:none;padding:0 8px;
}
.tbtn:active{background:rgba(255,255,255,.1)}
.tbtn svg{width:20px;height:20px;fill:var(--txt)}
.tbtn.on svg{fill:var(--ac2)}
.tbtn.on{color:var(--ac2)}
#titleBox{flex:1;min-width:0;line-height:1.3;padding:0 2px}
#titleBox .t1{font-size:.82rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#titleBox .t2{font-size:.64rem;color:var(--txt3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#pageSlider{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;
  background:rgba(255,255,255,.18);outline:none;margin:0 10px;min-width:60px}
#pageSlider::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:var(--grad);box-shadow:0 2px 8px rgba(124,108,255,.5)}
#pageLabel{font-size:.72rem;color:var(--txt2);min-width:52px;text-align:center;flex:none;font-variant-numeric:tabular-nums}
.modebtn{font-size:.68rem;font-weight:700;color:var(--txt2);width:auto;gap:4px}
.modebtn.on{color:var(--ac2)}

/* ---------- 卷轴模式 ---------- */
#scrollView{display:none;min-height:100vh;padding:calc(var(--barH)*.4) 0}
body.scroll-mode #scrollView{display:block}
.spage{width:100%;max-width:900px;margin:0 auto;position:relative;background:#0a0a0a}
.spage+.spage{margin-top:2px}
.spage img{width:100%;display:block;min-height:120px}
.spage .pno{position:absolute;right:8px;top:8px;font-size:.62rem;color:rgba(255,255,255,.55);
  background:rgba(0,0,0,.45);padding:2px 8px;border-radius:8px;pointer-events:none}
.spage .failed{position:absolute;inset:0;display:grid;place-items:center;color:var(--txt3);font-size:.78rem;cursor:pointer}
.chnav{max-width:900px;margin:14px auto 30px;padding:0 14px;display:flex;gap:10px}
.chnav button{
  flex:1;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--txt);
  border-radius:14px;padding:14px;font-size:.82rem;font-weight:700;cursor:pointer;
}
.chnav button:active{transform:scale(.96)}
.chnav button.primary{background:var(--grad);border:none}
.chnav button:disabled{opacity:.35}

/* ---------- 翻页模式 ---------- */
#pageView{display:none;position:fixed;inset:0;overflow:hidden;background:#000}
body.paged-mode #pageView{display:block}
#pageView.fit-width{overflow-y:auto}
#pimgWrap{position:absolute;inset:0;display:grid;place-items:center}
#pageView.fit-width #pimgWrap{position:static;display:block;min-height:100%}
#pimg{max-width:100%;max-height:100%;object-fit:contain;display:block;opacity:0;transition:opacity .18s}
#pimg.ok{opacity:1}
#pageView.fit-width #pimg{width:100%;max-width:none;max-height:none}
.zones{position:fixed;inset:0;z-index:20;display:flex}
#pageView.fit-width .zones{position:fixed}
.zone{height:100%}
.zone.l{width:28%}.zone.c{width:44%}.zone.r{width:28%}
.hint-arrow{
  position:fixed;top:50%;transform:translateY(-50%);z-index:19;pointer-events:none;
  width:44px;height:64px;display:grid;place-items:center;color:rgba(255,255,255,.85);
  background:rgba(0,0,0,.35);border-radius:12px;opacity:0;transition:opacity .15s;font-size:1.3rem;
}
.hint-arrow.show{opacity:1}
.hint-arrow.l{left:10px}.hint-arrow.r{right:10px}
#spinner{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:30;display:none;
  width:42px;height:42px;border-radius:50%;border:3px solid rgba(255,255,255,.15);
  border-top-color:var(--ac1);animation:spin .8s linear infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
#pretry{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:30;display:none;
  background:rgba(20,24,34,.95);border:1px solid var(--line);color:var(--txt);
  padding:14px 22px;border-radius:14px;font-size:.82rem;cursor:pointer}
#endCard{position:fixed;inset:0;z-index:40;display:none;place-items:center;background:rgba(0,0,0,.88)}
#endCard.show{display:grid}
#endCard .inner{text-align:center;padding:20px;animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1}}
#endCard .big{font-size:2.6rem;margin-bottom:10px}
#endCard h3{font-size:1rem;margin-bottom:6px}
#endCard p{font-size:.75rem;color:var(--txt3);margin-bottom:20px}
#endCard .btns{display:flex;gap:10px;justify-content:center}
#endCard button{border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--txt);
  border-radius:14px;padding:13px 22px;font-size:.85rem;font-weight:700;cursor:pointer}
#endCard button.primary{background:var(--grad);border:none}

/* ---------- 弹层 ---------- */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;opacity:0;pointer-events:none;transition:.25s}
.mask.show{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:99;max-width:640px;margin:0 auto;
  background:#12151f;border:1px solid var(--line);border-bottom:none;border-radius:22px 22px 0 0;
  padding:14px 18px calc(18px + var(--sab));transform:translateY(105%);
  transition:transform .3s cubic-bezier(.32,.72,.35,1);max-height:75vh;overflow-y:auto;
}
.sheet.show{transform:none}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-size:.95rem;font-weight:800;margin-bottom:10px}
.chitem{
  display:flex;align-items:center;gap:10px;padding:13px 12px;border-radius:12px;cursor:pointer;
  border:1px solid transparent;
}
.chitem:active{background:rgba(255,255,255,.06)}
.chitem.cur{border-color:rgba(124,108,255,.5);background:rgba(124,108,255,.1)}
.chitem .no{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.07);display:grid;
  place-items:center;font-size:.72rem;font-weight:800;color:var(--txt2);flex:none}
.chitem.cur .no{background:var(--grad);color:#fff}
.chitem .ct{flex:1;min-width:0}
.chitem .ct b{font-size:.82rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chitem .ct span{font-size:.66rem;color:var(--txt3)}
.setrow{display:flex;align-items:center;justify-content:space-between;padding:13px 2px;
  border-bottom:1px solid rgba(255,255,255,.05)}
.setrow:last-child{border-bottom:none}
.setrow .lab{font-size:.85rem;font-weight:600}
.setrow .lab small{display:block;font-size:.66rem;color:var(--txt3);margin-top:3px;font-weight:400}
.optseg{display:flex;gap:4px;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:11px;padding:3px}
.optseg button{border:none;background:transparent;color:var(--txt2);font-size:.72rem;font-weight:700;
  padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.optseg button.on{background:var(--grad);color:#fff}

/* ---------- toast / 错误页 ---------- */
#toast{position:fixed;left:50%;bottom:calc(90px + var(--sab));transform:translate(-50%,60px);
  background:rgba(20,24,34,.95);border:1px solid var(--line);padding:10px 18px;border-radius:12px;
  font-size:.78rem;z-index:200;transition:.3s;pointer-events:none;max-width:86vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
#fatal{position:fixed;inset:0;z-index:300;display:none;place-items:center;background:#0b0d13;text-align:center;padding:24px}
#fatal.show{display:grid}
#fatal .art{font-size:3rem;margin-bottom:14px}
#fatal h2{font-size:1rem;margin-bottom:8px}
#fatal p{font-size:.78rem;color:var(--txt3);margin-bottom:22px;line-height:1.7}
#fatal a{display:inline-block;text-decoration:none;background:var(--grad);color:#fff;
  padding:12px 26px;border-radius:14px;font-size:.85rem;font-weight:700}

/* ---------- 离线 ZIP 入口 ---------- */
#localGate{position:fixed;inset:0;z-index:250;display:none;place-items:center;background:#0b0d13;
  text-align:center;padding:24px}
#localGate.show{display:grid}
#localGate .art{font-size:3.2rem;margin-bottom:14px}
#localGate h2{font-size:1.1rem;margin-bottom:8px}
#localGate p{font-size:.78rem;color:var(--txt3);line-height:1.8;margin-bottom:24px}
#localGate .lg-btn{border:none;background:var(--grad);color:#fff;padding:14px 34px;border-radius:15px;
  font-size:.92rem;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(124,108,255,.35)}
#localGate .lg-btn:active{transform:scale(.96)}
#localGate .lg-status{font-size:.72rem;color:var(--txt2);margin-top:16px;min-height:1.2em;
  max-width:78vw;word-break:break-all}
#localGate .lg-back{display:inline-block;margin-top:22px;color:var(--ac2);font-size:.78rem;text-decoration:none}
</style>
</head>
<body>

<!-- 顶栏 -->
<div class="bar" id="topbar">
  <button class="tbtn" id="backBtn" aria-label="返回">
    <svg viewBox="0 0 24 24"><path d="M15.5 4.5 8 12l7.5 7.5 1.8-1.8L11.6 12l5.7-5.7z"/></svg>
  </button>
  <div id="titleBox"><div class="t1" id="comicTitle">加载中…</div><div class="t2" id="chTitle"></div></div>
  <button class="tbtn" id="zipBtn" title="打包下载" style="display:none">
    <svg viewBox="0 0 24 24"><path d="M12 3v10.2l-3.6-3.6-1.8 1.8 5.4 5.4 5.4-5.4-1.8-1.8-3.6 3.6V3h2zm-7 15h14v3H5v-3z" transform="translate(0,-1)"/></svg>
  </button>
  <button class="tbtn" id="chBtn" title="章节">
    <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4V6zm0 5h16v2H4v-2zm0 5h16v2H4v-2z"/></svg>
  </button>
  <button class="tbtn" id="setBtn" title="设置">
    <svg viewBox="0 0 24 24"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-1.7-1L14.9 3h-4l-.4 2.6a7.6 7.6 0 0 0-1.7 1l-2.4-1-2 3.4L6.4 11a7.5 7.5 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.6 7.6 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.6 7.6 0 0 0 1.7-1l2.4 1 2-3.4-2-1.6zM12.7 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
  </button>
</div>

<!-- 底栏 -->
<div class="bar" id="bottombar">
  <button class="tbtn modebtn on" id="mScroll">卷轴</button>
  <button class="tbtn modebtn" id="mPaged">翻页</button>
  <input type="range" id="pageSlider" min="1" max="1" value="1">
  <span id="pageLabel">1/1</span>
  <button class="tbtn" id="prevChBtn" title="上一章"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6V6zm3.5 6 8.5 6V6l-8.5 6z"/></svg></button>
  <button class="tbtn" id="nextChBtn" title="下一章"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2V6zM6 18l8.5-6L6 6v12z"/></svg></button>
</div>

<!-- 卷轴视图 -->
<div id="scrollView"></div>

<!-- 翻页视图 -->
<div id="pageView">
  <div id="pimgWrap"><img id="pimg" alt=""></div>
  <div class="zones" id="zones">
    <div class="zone l" data-z="l"></div>
    <div class="zone c" data-z="c"></div>
    <div class="zone r" data-z="r"></div>
  </div>
  <div class="hint-arrow l" id="arrL">‹</div>
  <div class="hint-arrow r" id="arrR">›</div>
</div>
<div id="spinner"></div>
<button id="pretry">⚠️ 加载失败，点击重试</button>

<!-- 章节结束卡 -->
<div id="endCard"><div class="inner">
  <div class="big">🎉</div>
  <h3 id="endTitle">本章完</h3>
  <p id="endSub"></p>
  <div class="btns">
    <button id="endHomeBtn">返回书架</button>
    <button class="primary" id="endNextBtn">下一章</button>
  </div>
</div></div>

<!-- 章节弹层 -->
<div class="mask" id="mask"></div>
<div class="sheet" id="chSheet">
  <div class="grab"></div><h3>章节目录</h3>
  <div id="chList"></div>
</div>

<!-- 设置弹层 -->
<div class="sheet" id="setSheet">
  <div class="grab"></div><h3>阅读设置</h3>
  <div class="setrow">
    <div class="lab">默认阅读模式<small>下次打开本子时生效</small></div>
    <div class="optseg" data-k="defMode">
      <button data-v="scroll">卷轴</button><button data-v="paged">翻页</button>
    </div>
  </div>
  <div class="setrow">
    <div class="lab">翻页方向<small>日漫习惯选「右翻左」</small></div>
    <div class="optseg" data-k="dir">
      <button data-v="ltr">左翻右</button><button data-v="rtl">右翻左</button>
    </div>
  </div>
  <div class="setrow">
    <div class="lab">翻页适应方式<small>长图建议「适应宽度」</small></div>
    <div class="optseg" data-k="fit">
      <button data-v="contain">适应屏幕</button><button data-v="width">适应宽度</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<div id="fatal"><div>
  <div class="art">😢</div>
  <h2 id="fatalTitle">本子不存在或尚未爬取</h2>
  <p id="fatalSub">请回到书架先提交爬取任务</p>
  <a href="index.html">返回书架</a>
</div></div>

<!-- 离线 ZIP 入口 -->
<div id="localGate"><div>
  <div class="art">📂</div>
  <h2>离线阅读</h2>
  <p>选择已下载到本机的 ZIP 压缩包<br>无需联网爬取，图片直接在浏览器内解包阅读</p>
  <button class="lg-btn" id="pickZipBtn">选择 ZIP 文件</button>
  <div class="lg-status" id="lgStatus"></div>
  <a class="lg-back" href="index.html">← 返回书架</a>
  <input type="file" id="zipFile" accept=".zip,application/zip" style="display:none">
</div></div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var toastTimer=null;
function toast(msg,ms){var t=$('#toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show')},ms||1800);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var store={
  get:function(k,d){try{var v=localStorage.getItem('jm_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set:function(k,v){try{localStorage.setItem('jm_'+k,JSON.stringify(v))}catch(e){}}
};

/* ================= 状态 ================= */
var qs=new URLSearchParams(location.search);
var isLocal=qs.get('local')==='1';
var S={
  id:qs.get('id'),
  manifest:null,
  baseUrl:'',
  ch:parseInt(qs.get('ch')||'0',10)||0,   // 1-based，0 表示未指定
  p:parseInt(qs.get('p')||'0',10)||0,
  mode:store.get('defMode','scroll'),
  dir:store.get('dir','ltr'),
  fit:store.get('fit','contain'),
  ui:true,
};

function chapter(){return S.manifest.chapters[S.ch-1]}
function pageCount(){return chapter().pages.length}
function pageUrl(chIdx,pIdx){
  var u=S.manifest.chapters[chIdx-1].pages[pIdx-1];
  return /^(blob|data|https?):/.test(u)?u:(S.baseUrl+u);
}

/* ================= 初始化 ================= */
if(isLocal){
  initLocalGate();
}else{
  if(!S.id){fatal('缺少本子ID参数');}
  else{
    S.baseUrl='comics/'+encodeURIComponent(S.id)+'/';
    fetch(S.baseUrl+'manifest.json?t='+Date.now(),{cache:'no-store'})
      .then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})
      .then(initWithManifest)
      .catch(function(){fatal('本子不存在或尚未爬取','manifest 加载失败，可能还在部署中，稍等 1~2 分钟刷新试试')});
  }
}

function initWithManifest(m){
  if(!m.chapters||!m.chapters.length){fatal('本子内容为空');return;}
  S.manifest=m;
  if(!S.id)S.id=m.id;
  document.title='《'+m.title+'》- JMComic 云书架';
  $('#comicTitle').textContent=m.title;
  if(m.hasZip&&m.zip){
    var zb=$('#zipBtn');zb.style.display='grid';
    zb.addEventListener('click',function(){location.href=S.baseUrl+encodeURIComponent(m.zip)});
  }
  // 恢复进度
  if(!S.ch){
    var prog=store.get('prog_'+S.id,null);
    if(prog&&prog.ch<=m.chapters.length){
      S.ch=prog.ch;S.p=prog.p||1;
      setTimeout(function(){toast('已恢复到 第'+S.ch+'章 第'+S.p+'页')},600);
    }else{S.ch=1;S.p=1;}
  }
  if(!S.p)S.p=1;
  buildChapterList();
  initSettings();
  applyMode(S.mode,true);
}

function fatal(t,sub){
  var f=$('#fatal');f.classList.add('show');
  if(t)$('#fatalTitle').textContent=t;
  if(sub)$('#fatalSub').textContent=sub;
}

/* ================= 离线 ZIP 阅读 ================= */
function naturalCompare(a,b){
  var ka=a.split(/(\d+)/),kb=b.split(/(\d+)/);
  for(var i=0;i<Math.max(ka.length,kb.length);i++){
    var x=ka[i]||'',y=kb[i]||'';
    if(x===y)continue;
    var nx=parseInt(x,10),ny=parseInt(y,10);
    if(!isNaN(nx)&&!isNaN(ny))return nx-ny;
    return x<y?-1:1;
  }
  return 0;
}

function initLocalGate(){
  document.title='离线阅读 - JMComic 云书架';
  var gate=$('#localGate');gate.classList.add('show');
  $('#pickZipBtn').addEventListener('click',function(){$('#zipFile').click()});
  $('#zipFile').addEventListener('change',function(){
    var f=this.files[0];if(!f)return;
    var st=$('#lgStatus');
    if(typeof JSZip==='undefined'){st.textContent='❌ 解压组件(JSZip)未加载，请检查 vendor/jszip.min.js';return;}
    st.textContent='解析中… '+f.name;
    JSZip.loadAsync(f).then(function(zip){
      var IMG=/\.(jpe?g|png|webp|gif|avif|bmp)$/i;
      var groups={},order=[];
      zip.forEach(function(rel,entry){
        if(entry.dir||!IMG.test(rel))return;
        var dir=rel.indexOf('/')>=0?rel.slice(0,rel.lastIndexOf('/')):'';
        if(!groups[dir]){groups[dir]=[];order.push(dir);}
        groups[dir].push(rel);
      });
      order.sort(naturalCompare);
      if(!order.length)throw new Error('ZIP 中没有找到图片文件');
      var chapters=order.map(function(dir,i){
        var files=groups[dir].slice().sort(naturalCompare);
        var title=dir?dir.split('/').pop().replace(/^\d+_/,''):'全部图片';
        return {index:i+1,photoId:'local',title:title,pageCount:files.length,
          pages:files.map(function(p){return zip.file(p)})};
      });
      return Promise.all(chapters.map(function(c){
        return Promise.all(c.pages.map(function(entry){
          return entry.async('blob').then(function(b){return URL.createObjectURL(b)});
        })).then(function(urls){c.pages=urls});
      })).then(function(){return chapters});
    }).then(function(chapters){
      var total=chapters.reduce(function(s,c){return s+c.pageCount},0);
      var m={id:'local_'+f.name,title:f.name.replace(/\.zip$/i,''),author:'本地文件',authors:[],tags:[],
        description:'',updatedAt:new Date().toISOString(),hasReader:true,hasZip:false,zip:null,
        pageCount:total,chapterCount:chapters.length,chapters:chapters};
      S.id=m.id;
      gate.classList.remove('show');
      initWithManifest(m);
      toast('已加载 '+chapters.length+' 章 / '+total+' 页');
    }).catch(function(e){
      st.textContent='❌ '+(e&&e.message?e.message:'无法解析该 ZIP 文件');
    });
  });
}

/* ================= 进度保存 ================= */
var saveTimer=null;
function saveProgress(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    store.set('prog_'+S.id,{ch:S.ch,p:S.p,t:Date.now()});
  },400);
}

/* ================= UI 显隐 ================= */
function setUI(on){
  S.ui=on;
  document.body.classList.toggle('ui-hidden',!on);
}
function toggleUI(){setUI(!S.ui)}
// 初次加载 4 秒后自动隐藏，进入沉浸阅读
setTimeout(function(){if(S.manifest)setUI(false)},4000);

/* ================= 顶/底栏事件 ================= */
$('#backBtn').addEventListener('click',function(){location.href='index.html'});
$('#pageSlider').addEventListener('input',function(){goPage(parseInt(this.value,10))});
$('#prevChBtn').addEventListener('click',function(){goChapter(S.ch-1)});
$('#nextChBtn').addEventListener('click',function(){goChapter(S.ch+1)});
$('#mScroll').addEventListener('click',function(){applyMode('scroll')});
$('#mPaged').addEventListener('click',function(){applyMode('paged')});

/* ================= 模式切换 ================= */
function applyMode(mode,first){
  S.mode=mode;
  store.set('defMode',mode);
  document.body.classList.toggle('scroll-mode',mode==='scroll');
  document.body.classList.toggle('paged-mode',mode==='paged');
  $('#mScroll').classList.toggle('on',mode==='scroll');
  $('#mPaged').classList.toggle('on',mode==='paged');
  renderChapter(first);
}
function goChapter(n){
  if(!S.manifest)return;
  if(n<1){toast('已经是第一章了');return;}
  if(n>S.manifest.chapters.length){toast('已经是最后一章了');return;}
  S.ch=n;S.p=1;
  $('#endCard').classList.remove('show');
  buildChapterList();
  renderChapter();
  saveProgress();
}
function goPage(n){
  var max=pageCount();
  if(n<1)n=1;if(n>max)n=max;
  S.p=n;
  if(S.mode==='paged')renderPaged();
  else scrollToPage(n);
  saveProgress();
}
function nextPage(){
  if(S.p<pageCount()){S.p++;renderPaged();saveProgress();}
  else if(S.ch<S.manifest.chapters.length){showEndCard();}
  else{showEndCard(true);}
}
function prevPage(){
  if(S.p>1){S.p--;renderPaged();saveProgress();}
  else if(S.ch>1){S.ch--;S.p=pageCount();buildChapterList();renderChapter();saveProgress();toast('上一章 第'+S.p+'页');}
  else toast('已经是第一页了');
}
function showEndCard(all){
  $('#endTitle').textContent=all?'🎉 全部读完啦':'第 '+S.ch+' 章完';
  $('#endSub').textContent=all?'《'+S.manifest.title+'》已读到最后':'休息一下，还是接着看下一章？';
  $('#endNextBtn').style.display=all?'none':'inline-block';
  $('#endCard').classList.add('show');
}
$('#endNextBtn').addEventListener('click',function(){goChapter(S.ch+1)});
$('#endHomeBtn').addEventListener('click',function(){location.href='index.html'});

/* ================= 渲染分发 ================= */
function renderChapter(first){
  var ch=chapter();
  $('#chTitle').textContent='第'+S.ch+'章 · '+ch.title+'（共'+ch.pageCount+'页）';
  var sl=$('#pageSlider');sl.max=ch.pageCount;sl.value=S.p;
  $('#pageLabel').textContent=S.p+'/'+ch.pageCount;
  $('#prevChBtn').style.opacity=S.ch>1?1:.35;
  $('#nextChBtn').style.opacity=S.ch<S.manifest.chapters.length?1:.35;
  if(S.mode==='scroll')renderScroll(first);
  else renderPaged();
}

/* ================= 卷轴模式 ================= */
var loadObserver=null,trackObserver=null;
function renderScroll(first){
  teardownObservers();
  $('#endCard').classList.remove('show');
  var view=$('#scrollView');
  var ch=chapter();
  var html='';
  for(var i=1;i<=ch.pages.length;i++){
    html+='<div class="spage" data-p="'+i+'">'+
      '<img data-src="'+esc(pageUrl(S.ch,i))+'" alt="第'+i+'页">'+
      '<div class="pno">'+i+' / '+ch.pages.length+'</div></div>';
  }
  html+='<div class="chnav">'+
    '<button id="sPrevCh" '+(S.ch<=1?'disabled':'')+'>← 上一章</button>'+
    '<button id="sNextCh" class="primary" '+(S.ch>=S.manifest.chapters.length?'disabled':'')+'>下一章 →</button></div>';
  view.innerHTML=html;
  window.scrollTo(0,0);

  // 图片懒加载
  loadObserver=new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if(!en.isIntersecting)return;
      var img=en.target.querySelector('img');
      if(img&&img.dataset.src){loadScrollImg(img);loadObserver.unobserve(en.target);}
    });
  },{rootMargin:'160% 0px'});
  view.querySelectorAll('.spage').forEach(function(el){loadObserver.observe(el)});

  // 当前页跟踪
  trackObserver=new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if(!en.isIntersecting)return;
      var p=parseInt(en.target.dataset.p,10);
      if(p!==S.p){S.p=p;syncPageUI();saveProgress();}
    });
  },{rootMargin:'-45% 0px -45% 0px'});
  view.querySelectorAll('.spage').forEach(function(el){trackObserver.observe(el)});

  var sp=$('#sPrevCh'),sn=$('#sNextCh');
  if(sp)sp.addEventListener('click',function(e){e.stopPropagation();goChapter(S.ch-1)});
  if(sn)sn.addEventListener('click',function(e){e.stopPropagation();goChapter(S.ch+1)});

  if(S.p>1){
    setTimeout(function(){scrollToPage(S.p,true)},80);
  }
}
function loadScrollImg(img){
  img.src=img.dataset.src;
  img.addEventListener('load',function(){}, {once:true});
  img.addEventListener('error',function(){
    var box=img.parentElement;
    if(box.querySelector('.failed'))return;
    var f=document.createElement('div');
    f.className='failed';f.textContent='⚠️ 加载失败，点击重试';
    f.style.minHeight='160px';
    f.addEventListener('click',function(e){
      e.stopPropagation();f.remove();
      var u=img.dataset.src;
      img.src=/^blob:/.test(u)?u:(u+(u.indexOf('?')>=0?'&':'?')+'retry='+Date.now());
    });
    box.appendChild(f);
  },{once:true});
}
function scrollToPage(n,instant){
  var el=document.querySelector('.spage[data-p="'+n+'"]');
  if(el)el.scrollIntoView({behavior:instant?'auto':'smooth',block:'start'});
  S.p=n;syncPageUI();
}
function syncPageUI(){
  var sl=$('#pageSlider');if(document.activeElement!==sl)sl.value=S.p;
  $('#pageLabel').textContent=S.p+'/'+pageCount();
}
function teardownObservers(){
  if(loadObserver){loadObserver.disconnect();loadObserver=null;}
  if(trackObserver){trackObserver.disconnect();trackObserver=null;}
}
// 卷轴模式：点击切换 UI / 下滑隐藏上滑显示
$('#scrollView').addEventListener('click',function(e){
  if(e.target.closest('button,a'))return;
  toggleUI();
});
var lastY=0;
window.addEventListener('scroll',function(){
  if(S.mode!=='scroll')return;
  var y=window.scrollY;
  if(Math.abs(y-lastY)>60){
    if(y>lastY&&y>200&&S.ui)setUI(false);
    else if(y<lastY&&!S.ui)setUI(true);
    lastY=y;
  }
},{passive:true});

/* ================= 翻页模式 ================= */
var preloadCache={};
function renderPaged(){
  teardownObservers();
  var pv=$('#pageView');
  pv.classList.toggle('fit-width',S.fit==='width');
  pv.scrollTop=0;
  var img=$('#pimg');
  img.classList.remove('ok');
  $('#spinner').style.display='block';
  $('#pretry').style.display='none';
  var url=pageUrl(S.ch,S.p);
  loadOne(url,function(ok){
    $('#spinner').style.display='none';
    if(!ok){$('#pretry').style.display='block';return;}
    img.src=url;
  });
  syncPageUI();
  preloadAround();
}
$('#pimg').addEventListener('load',function(){this.classList.add('ok')});
$('#pretry').addEventListener('click',function(){renderPaged()});
function loadOne(url,cb){
  if(preloadCache[url]==='ok'){cb(true);return;}
  var im=new Image();
  im.onload=function(){preloadCache[url]='ok';cb(true)};
  im.onerror=function(){cb(false)};
  im.src=url;
}
function preloadAround(){
  [[S.ch,S.p+1],[S.ch,S.p+2],[S.ch,S.p-1]].forEach(function(pair){
    var c=pair[0],p=pair[1];
    if(c>=1&&c<=S.manifest.chapters.length&&p>=1&&p<=S.manifest.chapters[c-1].pages.length){
      var u=pageUrl(c,p);
      if(!preloadCache[u]){var im=new Image();im.onload=function(){preloadCache[u]='ok'};im.src=u;}
    }
  });
}
// 点按翻页
$('#zones').addEventListener('click',function(e){
  var z=e.target.dataset.z;
  if(z==='c'){toggleUI();return;}
  var isNext=(S.dir==='ltr')?(z==='r'):(z==='l');
  flashArrow(isNext?'r':'l');
  if(isNext)nextPage();else prevPage();
});
function flashArrow(side){
  var el=side==='l'?$('#arrL'):$('#arrR');
  el.classList.add('show');
  setTimeout(function(){el.classList.remove('show')},260);
}
// 滑动翻页
var tsX=0,tsY=0,tValid=false;
document.addEventListener('touchstart',function(e){
  if(S.mode!=='paged')return;
  var t=e.changedTouches[0];tsX=t.clientX;tsY=t.clientY;tValid=true;
},{passive:true});
document.addEventListener('touchend',function(e){
  if(S.mode!=='paged'||!tValid)return;
  tValid=false;
  var t=e.changedTouches[0];
  var dx=t.clientX-tsX,dy=t.clientY-tsY;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.6){
    var isNext=(S.dir==='ltr')?(dx<0):(dx>0);
    if(isNext)nextPage();else prevPage();
  }
},{passive:true});
// 键盘（桌面调试）
document.addEventListener('keydown',function(e){
  if(!S.manifest)return;
  var k=e.key;
  if(k==='ArrowLeft'){if(S.mode==='paged'){var n1=(S.dir==='ltr')?prevPage:nextPage;n1();}}
  else if(k==='ArrowRight'||k===' '){if(S.mode==='paged'){var n2=(S.dir==='ltr')?nextPage:prevPage;n2();e.preventDefault();}}
  else if(k==='ArrowDown'&&S.mode==='paged'){nextPage();}
  else if(k==='ArrowUp'&&S.mode==='paged'){prevPage();}
});

/* ================= 章节弹层 ================= */
var mask=$('#mask'),chSheet=$('#chSheet'),setSheet=$('#setSheet');
function openSheet(el){closeSheets();mask.classList.add('show');el.classList.add('show');}
function closeSheets(){mask.classList.remove('show');chSheet.classList.remove('show');setSheet.classList.remove('show');}
mask.addEventListener('click',closeSheets);
$('#chBtn').addEventListener('click',function(){openSheet(chSheet)});
$('#setBtn').addEventListener('click',function(){openSheet(setSheet)});
function buildChapterList(){
  var box=$('#chList');
  box.innerHTML=S.manifest.chapters.map(function(c){
    return '<div class="chitem'+(c.index===S.ch?' cur':'')+'" data-ch="'+c.index+'">'+
      '<div class="no">'+c.index+'</div>'+
      '<div class="ct"><b>'+esc(c.title||('第'+c.index+'章'))+'</b><span>'+c.pageCount+' 页</span></div></div>';
  }).join('');
  box.querySelectorAll('.chitem').forEach(function(el){
    el.addEventListener('click',function(){
      closeSheets();goChapter(parseInt(el.dataset.ch,10));
    });
  });
  var cur=box.querySelector('.chitem.cur');
  if(cur)setTimeout(function(){cur.scrollIntoView({block:'center'})},60);
}

/* ================= 设置 ================= */
function initSettings(){
  document.querySelectorAll('.optseg').forEach(function(seg){
    var k=seg.dataset.k;
    var cur=(k==='defMode')?S.mode:(k==='dir'?S.dir:S.fit);
    seg.querySelectorAll('button').forEach(function(b){b.classList.toggle('on',b.dataset.v===cur)});
    seg.addEventListener('click',function(e){
      var b=e.target.closest('button');if(!b)return;
      var v=b.dataset.v;
      seg.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b)});
      if(k==='defMode'){store.set('defMode',v);if(v!==S.mode)applyMode(v);}
      else if(k==='dir'){S.dir=v;store.set('dir',v);toast(v==='rtl'?'已切换：右侧上一页 / 左侧下一页':'已切换：左侧上一页 / 右侧下一页');}
      else if(k==='fit'){S.fit=v;store.set('fit',v);if(S.mode==='paged')renderPaged();}
    });
  });
}
})();
</script>
